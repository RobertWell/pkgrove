# PkgroveKit version catalog — single source of dependency truth.
[versions]
kotlin = "1.9.23"
dokka = "1.9.20"
jdbi = "3.42.0"
duckdb = "1.1.3"
hikaricp = "5.1.0"
ojdbc = "23.3.0.23.09"
junit = "5.10.2"
testcontainers = "1.21.4"
postgres-driver = "42.7.13"
coroutines = "1.8.1"
# HEL-170: coordination layer — jakarta.transaction API + Narayana as the
# established external transaction manager (never a custom 2PC).
jakarta-transaction = "2.0.1"
narayana = "7.0.2.Final"
jboss-logging = "3.5.3.Final"
# HEL-172: framework adapters. Frameworks are compileOnly in the adapters and
# full only in their (unpublished) integration-test modules.
spring-boot = "3.3.5"
# HEL-236: S3-compatible object storage adapter — AWS SDK for Java 2.x, s3
# module only (never the full SDK BOM surface).
awssdk = "2.51.3"
spring = "6.1.14"
quarkus = "3.21.1"
cdi-api = "4.0.1"
mp-config-api = "3.1"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
jdbi3-core = { module = "org.jdbi:jdbi3-core", version.ref = "jdbi" }
duckdb-jdbc = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
ojdbc11 = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "ojdbc" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
# HEL-234: real-savepoint engine for the SavepointPerBatch policy tests —
# DuckDB (the jdbc module's usual zero-config DB) has no JDBC savepoints.
h2 = { module = "com.h2database:h2", version = "2.3.230" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers-oracle = { module = "org.testcontainers:oracle-free", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgres = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
# HEL-236: MinIO is the tested S3-compatible target (no MinIO SDK — the AWS
# SDK client speaks to it, which is exactly the compatibility being proven).
testcontainers-minio = { module = "org.testcontainers:minio", version.ref = "testcontainers" }
awssdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awssdk" }
# apache-client is s3's own default sync transport (runtime scope in its POM);
# declared explicitly because the adapter configures it (timeouts, TLS).
awssdk-apache-client = { module = "software.amazon.awssdk:apache-client", version.ref = "awssdk" }
postgres-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgres-driver" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
jakarta-transaction-api = { module = "jakarta.transaction:jakarta.transaction-api", version.ref = "jakarta-transaction" }
narayana-jta = { module = "org.jboss.narayana.jta:narayana-jta", version.ref = "narayana" }
jboss-logging = { module = "org.jboss.logging:jboss-logging", version.ref = "jboss-logging" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc", version.ref = "spring-boot" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test", version.ref = "spring-boot" }
spring-jdbc = { module = "org.springframework:spring-jdbc", version.ref = "spring" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring" }
quarkus-agroal = { module = "io.quarkus:quarkus-agroal", version.ref = "quarkus" }
quarkus-junit5 = { module = "io.quarkus:quarkus-junit5", version.ref = "quarkus" }
quarkus-jdbc-h2 = { module = "io.quarkus:quarkus-jdbc-h2", version.ref = "quarkus" }
cdi-api = { module = "jakarta.enterprise:jakarta.enterprise.cdi-api", version.ref = "cdi-api" }
mp-config-api = { module = "org.eclipse.microprofile.config:microprofile-config-api", version.ref = "mp-config-api" }

[plugins]
cyclonedx = { id = "org.cyclonedx.bom", version = "1.8.2" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
