# PkgroveKit — GitLab CI (LAN mirror `root/pkgrovekit`; main-of-record is GitHub).
#
# HEL-124 (owner directive): verification-metadata.xml is generated INSIDE
# GitLab CI, never locally. This job:
#   1. UNION-APPENDS onto the committed file (Gradle's --write-verification-
#      metadata adds missing entries and never removes existing ones, so the
#      GitHub-runner-resolved entries are preserved and the union satisfies
#      both CI environments — including AuditPatchX's from-source provisioning
#      build, which runs in this same GitLab runner environment).
#   2. Proves the ENFORCED build passes in this environment (no --write flag).
#   3. Exposes gradle/verification-metadata.xml as the job artifact — the ONLY
#      sanctioned source for updating the file on GitHub main (fetch the
#      artifact, commit it verbatim; do not regenerate anywhere else).
#
# Refresh flow after a dependency change:
#   push the change to the GitLab mirror -> this job runs -> fetch the artifact
#   -> commit it to GitHub main -> GitHub CI enforces it green.
default:
  interruptible: true

stages:
  - verify
  - publish

verification-metadata:
  stage: verify
  # same warm image the AuditPatchX backend job uses (JDK 21; wrapper supplies Gradle)
  image: maven:3.9-eclipse-temurin-21
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1g"
  cache:
    key: pkgrovekit-gradle
    paths:
      - .gradle-home/caches
      - .gradle-home/wrapper
  script:
    # 1) union-append over the SUPERSET of every enforcing Gradle invocation
    #    (check + gate + SBOM + CodeQL graphs; integration-tests excluded — its
    #    heavy testcontainer runtime is verified leniently and never published.
    #    resolvePitestClasspath pulls the PIT tool classpath into the metadata
    #    without running a full mutation analysis — HEL-234)
    - ./gradlew --no-daemon --write-verification-metadata sha256
        clean build publishToMavenLocal cyclonedxBom resolvePitestClasspath -x :integration-tests:test
    # 2) prove the enforced build passes IN THIS ENVIRONMENT
    - ./gradlew --no-daemon
        clean build publishToMavenLocal cyclonedxBom resolvePitestClasspath -x :integration-tests:test
    # 3) surface whether generation changed anything (informational)
    - git diff --stat -- gradle/verification-metadata.xml || true
    # 4) HEL-234: SHA-tied release evidence over this enforced build's outputs
    - bash scripts/gen-release-evidence.sh build/release-evidence.md
  artifacts:
    name: verification-metadata
    paths:
      - gradle/verification-metadata.xml
      - build/release-evidence.md
    expire_in: 90 days

# HEL-235: architecture enforcement. `assertModuleHierarchy` fails the build on
# any module-boundary violation (undeclared/mis-scoped edge, cycle,
# adapter->adapter, framework/jdbi/jta/driver/test leak, POM divergence, BOM
# gap) against the machine-readable gradle/allowed-dependencies.txt. It also
# rides every module's `check`, so the enforced build above already runs it —
# this job surfaces it as a fast standalone gate AND proves the boundary from
# the CONSUMER side: publish to mavenLocal, then resolve the 8 standalone
# consumer fixtures and assert required-present / forbidden-absent per scenario.
module-hierarchy:
  stage: verify
  image: maven:3.9-eclipse-temurin-21
  needs: []
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1g"
  cache:
    key: pkgrovekit-gradle
    paths:
      - .gradle-home/caches
      - .gradle-home/wrapper
  script:
    # 1) declared + resolved boundary enforcement (standalone, fast)
    - ./gradlew --no-daemon assertModuleHierarchy
    # 2) publish this build to mavenLocal so the fixtures resolve real POMs
    - ./gradlew --no-daemon publishToMavenLocal
        -x :integration-tests:test -x :integration-tests-quarkus:test
    # 3) resolve every consumer fixture against mavenLocal + assert boundaries
    - ./gradlew --no-daemon -p consumer-fixtures verifyAllFixtures
  artifacts:
    name: consumer-fixture-classpaths
    when: always
    paths:
      - consumer-fixtures/*/build/runtime-classpath.txt
    expire_in: 30 days

# HEL-123: publish the immutable release to THIS project's Maven package
# registry, so LAN CI consumers (AuditPatchX) resolve PkgroveKit as a normal
# registry dependency — PAT-free (public project => anonymous reads; the
# publish authenticates with the ephemeral job token). Gated on the verify
# stage, which runs the full test build under ENFORCED dependency verification.
# IMMUTABILITY: a version is published AT MOST ONCE — if the registry already
# has it, the job skips (GitLab's Maven registry would otherwise accept a
# re-publication, silently mutating the version as main moves — forbidden by
# the release-version policy). Shipping new content requires a version bump.
publish-registry:
  stage: publish
  image: maven:3.9-eclipse-temurin-21
  needs: [verification-metadata]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1g"
    # CI_API_V4_URL is the EDGE hostname (gitlab.local.test), which in-cluster
    # job pods cannot resolve — publish via the cluster service DNS instead
    # (same accepted plain-http in-cluster hop as the datakit deploy).
    PKGROVEKIT_GITLAB_MAVEN_URL: "http://gitlab.gitlab.svc.cluster.local/api/v4/projects/$CI_PROJECT_ID/packages/maven"
  cache:
    key: pkgrovekit-gradle
    paths:
      - .gradle-home/caches
      - .gradle-home/wrapper
  script:
    # immutability guard: never re-publish an existing version
    - |
      VERSION=$(./gradlew --no-daemon -q :pkgrovekit-core:properties --property version | awk '/^version:/ {print $2}')
      echo "resolved version: $VERSION"
      case "$VERSION" in *-SNAPSHOT|*-dev*) echo "refusing to publish mutable version"; exit 1;; esac
      CODE=$(curl -s -o /dev/null -w '%{http_code}' \
        "$PKGROVEKIT_GITLAB_MAVEN_URL/com/pkgrove/pkgrovekit/pkgrovekit-core/$VERSION/pkgrovekit-core-$VERSION.pom")
      if [ "$CODE" = "200" ]; then
        echo "version $VERSION already in the registry — immutable, skipping publish (bump the version to ship new content)"
        exit 0
      fi
      ./gradlew --no-daemon publishAllPublicationsToGitLabLanRepository -x :integration-tests:test

# ── HEL-234 (owner mandate 2026-08-09): changed-code coverage gate ───────────
# Coverage ON THE LINES THE CHANGE TOUCHED must be >= 80% — the absolute module
# floors cannot see an under-tested change inside a well-covered module. Runs
# on every push/MR (merge-blocking: not allow_failure, so an MR pipeline red
# blocks the merge under the project's pipelines-must-succeed setting). Base =
# the MR diff base when in an MR pipeline, else the previous push SHA.
diff-coverage:
  stage: verify
  image: maven:3.9-eclipse-temurin-21
  needs: []
  variables:
    GIT_DEPTH: "0"   # the gate diffs against a historical base — no shallow clone
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1g"
  cache:
    key: pkgrovekit-gradle
    paths:
      - .gradle-home/caches
      - .gradle-home/wrapper
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - |
      BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-HEAD~1}}"
      case "$BASE" in 0000000000000000000000000000000000000000|"") BASE="HEAD~1";; esac
      echo "diff-coverage base: $BASE"
      ./gradlew --no-daemon jacocoDiffCoverageCheck -PdiffCoverageBase="$BASE"
  artifacts:
    when: always
    paths:
      - build/reports/jacoco/jacocoAggregatedReport/
    expire_in: 90 days

# ── HEL-234 (owner mandate 2026-08-09): REQUIRED Oracle integration, per SHA ─
# The Oracle-Free testcontainer suite is flaky on GitHub's shared hosted
# runners (that job stays informational there) — but THIS runner is the LAN
# self-hosted privileged runner, where the identical suite passes reliably, so
# here it is a REQUIRED gate tied to the exact SHA of every push/MR. No
# allow_failure: a red integration-oracle blocks the merge.
integration-oracle:
  stage: verify
  image: maven:3.9-eclipse-temurin-21
  timeout: 60m
  needs: []
  tags:
    - privileged
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--dns", "8.8.8.8", "--dns", "8.8.4.4"]
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1g"
  cache:
    key: pkgrovekit-gradle
    paths:
      - .gradle-home/caches
      - .gradle-home/wrapper
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - ./gradlew --no-daemon :integration-tests:test --tests '*Oracle*'
  artifacts:
    when: always
    paths:
      - integration-tests/build/test-results/test/
      - integration-tests/build/reports/tests/test/
    reports:
      junit: integration-tests/build/test-results/test/TEST-*.xml
    expire_in: 90 days

# ── HEL-234 (owner mandate 2026-08-09): scheduled mutation gate ──────────────
# PIT over the critical modules (jdbc/transfer/coordination-api/jta). The
# per-module mutationThreshold in build.gradle.kts HARD-FAILS the pitest task —
# and therefore this job — when too many mutants survive. Scheduled (nightly)
# because a full mutation analysis is prohibitive per-PR; MUTATION_TIER=1
# allows manual proof pipelines. Reports are retained a year as the trend
# record (docs/release-evidence.md documents locations).
mutation:
  stage: verify
  image: maven:3.9-eclipse-temurin-21
  timeout: 120m
  needs: []
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"
  cache:
    key: pkgrovekit-gradle
    paths:
      - .gradle-home/caches
      - .gradle-home/wrapper
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $MUTATION_TIER == "1"
  script:
    - ./gradlew --no-daemon mutationTest
  artifacts:
    when: always
    paths:
      - pkgrovekit-jdbc/build/reports/pitest/
      - pkgrovekit-transfer/build/reports/pitest/
      - pkgrovekit-coordination-api/build/reports/pitest/
      - pkgrovekit-jta/build/reports/pitest/
    expire_in: 365 days

# ── HEL-129: scheduled stress/soak tier ──────────────────────────────────────
# Distinct from `verification-metadata` (which excludes :integration-tests:test
# for cycle-time). Runs the live-Postgres stress + lifecycle + backpressure ITs
# over dind on the privileged runner. Triggers: pipeline schedule (nightly) or
# an explicit STRESS_TIER=1 pipeline (manual proof runs). The Oracle lifecycle
# matrix (OracleRealPoolLifecycleIT) stays in the local/full matrix — its 3 GB
# image is not worth a nightly pull; traceability doc records the split.
# HEL-234 (owner mandate 2026-08-09): now ALSO runs TransferSoakIT — a 12-min
# bounded soak with hard LEAK/BOUNDEDNESS gates (post-GC heap ceiling + growth
# trend, lease/session/thread leak deltas). Its soak-trend.csv is the RETAINED
# trend artifact (365 days) so cross-night drift is comparable.
stress-soak:
  stage: verify
  image: maven:3.9-eclipse-temurin-21
  timeout: 90m
  tags:
    - privileged
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--dns", "8.8.8.8", "--dns", "8.8.4.4"]
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1g"
  cache:
    key: pkgrovekit-gradle
    paths:
      - .gradle-home/caches
      - .gradle-home/wrapper
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $STRESS_TIER == "1"
  script:
    - >
      ./gradlew --no-daemon :integration-tests:test
      -Ppkgrovekit.soak.minutes=12
      --tests "com.pkgrove.pkgrovekit.it.LifecycleStressIT"
      --tests "com.pkgrove.pkgrovekit.it.RealPoolLifecycleIT"
      --tests "com.pkgrove.pkgrovekit.it.SlowTargetBackpressureIT"
      --tests "com.pkgrove.pkgrovekit.it.TransferSoakIT"
  artifacts:
    when: always
    paths:
      - integration-tests/build/test-results/test/
      - integration-tests/build/reports/tests/test/
      - integration-tests/build/soak/soak-trend.csv
    reports:
      junit: integration-tests/build/test-results/test/TEST-*.xml
    expire_in: 365 days
