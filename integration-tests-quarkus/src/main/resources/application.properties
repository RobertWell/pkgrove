# integration-tests-quarkus (HEL-172): two live Agroal datasources (H2 in-mem)
# + the PkgroveKit database declarations the producer wires them into.

# default datasource
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.jdbc.url=jdbc:h2:mem:pkgrovekit_default;DB_CLOSE_DELAY=-1

# named datasource "warehouse" (a SECOND, independent H2 database)
quarkus.datasource."warehouse".db-kind=h2
quarkus.datasource."warehouse".username=sa
quarkus.datasource."warehouse".jdbc.url=jdbc:h2:mem:pkgrovekit_warehouse;DB_CLOSE_DELAY=-1

# PkgroveKit: "main" rides the DEFAULT datasource (via the explicit <default>
# literal), "warehouse" rides the named one. H2 has no dedicated PkgroveKit
# dialect module — the generic ansi dialect covers CREATE/INSERT/SELECT.
pkgrovekit.databases.main.dialect=ansi
pkgrovekit.databases.main.datasource=<default>
pkgrovekit.databases.warehouse.datasource=warehouse
pkgrovekit.databases.warehouse.dialect=ansi
pkgrovekit.databases.warehouse.max-connections=4
