# HEL-124 §2: PR dependency review — newly introduced HIGH/CRITICAL vulnerable
# dependencies fail the check (package, version, advisory, path, and fixed
# version are rendered in the PR). Configure this check as REQUIRED in branch
# protection (repo setting — see docs/security-controls.md owner checklist).
name: dependency-review
on: [pull_request]
permissions:
  contents: read
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
