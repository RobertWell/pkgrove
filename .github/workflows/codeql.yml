# HEL-124 §8: source-code static analysis (Kotlin/Java) — findings surface in
# the Security tab; HIGH/CRITICAL alerts are handled via docs/security-controls.md.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew classes -x test
      - uses: github/codeql-action/analyze@v3
