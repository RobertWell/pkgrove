# RowRelay publish (HEL-123 §5): SNAPSHOT publication to GitHub Packages,
# HARD-GATED on the full check + the HEL-124 security gate. Uses the workflow
# GITHUB_TOKEN only; no tokens in the repository.
#
# Trigger is DELIBERATE (tag push or manual dispatch), not every main commit:
# GitHub Packages' Maven registry does NOT overwrite an existing version, so
# re-publishing an unchanged SNAPSHOT from routine commits 409s. Publishing on
# a version tag (or manual dispatch after a version bump) matches the issue's
# versioned-release policy (0.1.0 -> 0.1.1-SNAPSHOT -> ...). Security still
# runs on every push/PR via ci.yml + security.yml independently of this.
name: publish
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  # HEL-124 §5: the SAME security gate runs in-workflow — publish depends on it,
  # and because workflow_dispatch triggers this whole workflow, a manual publish
  # cannot bypass it either.
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  # Same blocking gate as ci.yml's `check`: the full clean check EXCEPT the
  # Oracle-Free integration-tests, which are unreliable on GitHub's shared
  # hosted runner (they pass reliably in local clean check). Gating a publish on
  # an infra-flaky testcontainer would block legitimate releases; the CVE/
  # security gate below still runs, and the authoritative live-DB proof is the
  # local/self-hosted run made before tagging a release.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew clean check -x :integration-tests:test

  publish:
    needs: [gate, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      # `check` already ran (and passed) in the gate job; publish only deploys.
      - run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
