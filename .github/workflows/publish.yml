# RowRelay publish (HEL-123 §5): IMMUTABLE-release publication to GitHub
# Packages, HARD-GATED on the full check + the HEL-124 security gate. Uses the
# workflow GITHUB_TOKEN only; no tokens in the repository.
#
# Trigger is DELIBERATE (tag push or manual dispatch), not every main commit:
# GitHub Packages' Maven registry does NOT overwrite an existing version, and
# per the owner release-version policy RowRelay publishes ONLY immutable
# releases (no `-SNAPSHOT`) — each release is a fresh MAJOR/MINOR/PATCH bump on
# a version tag (or manual dispatch after a bump). The gate below refuses to
# publish any non-immutable version. Security still runs on every push/PR via
# ci.yml + security.yml independently of this.
name: publish
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  # HEL-124 §5: the SAME security gate runs in-workflow — publish depends on it,
  # and because workflow_dispatch triggers this whole workflow, a manual publish
  # cannot bypass it either.
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  # Same blocking gate as ci.yml's `check`: the full clean check EXCEPT the
  # Oracle-Free integration-tests, which are unreliable on GitHub's shared
  # hosted runner (they pass reliably in local clean check). Gating a publish on
  # an infra-flaky testcontainer would block legitimate releases; the CVE/
  # security gate below still runs, and the authoritative live-DB proof is the
  # local/self-hosted run made before tagging a release.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      # Policy guard: refuse to publish a mutable version. `-Pdev` and any stray
      # `-SNAPSHOT` produce non-immutable coordinates and must never reach the
      # registry — fail the release here, loudly, before any artifact is built.
      - name: Enforce immutable-release version
        run: |
          VERSION=$(./gradlew -q :rowrelay-core:properties --property version | awk '/^version:/ {print $2}')
          echo "resolved version: $VERSION"
          case "$VERSION" in
            *-SNAPSHOT|*-dev*|*+*)
              echo "::error::Refusing to publish non-immutable version '$VERSION' (release-version policy: immutable releases only)."
              exit 1 ;;
          esac
      # publishToMavenLocal builds ALL publish artifacts (incl. dokka javadoc
      # jars) — so a broken lock/artifact fails HERE, not at the remote deploy.
      - run: ./gradlew clean check publishToMavenLocal -x :integration-tests:test

  publish:
    needs: [gate, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      # `check` already ran (and passed) in the gate job; publish only deploys.
      - run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
