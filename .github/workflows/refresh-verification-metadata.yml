# RowRelay dependency-verification refresh (HEL-124).
#
# Gradle dependency verification (gradle/verification-metadata.xml) pins a
# SHA-256 for every resolved dependency + POM, and is ENFORCED automatically on
# every build once the file is present — the `gate` job (publish.yml) and the
# `check` job (ci.yml) both fail if a resolved artifact's checksum does not match.
#
# The lesson from the first attempt: the metadata must be GENERATED IN THE
# ENVIRONMENT THAT ENFORCES IT — a workstation resolves a slightly different set
# (plugin markers / dokka variants) than the runner. This workflow regenerates
# the file on an ubuntu runner over the exact gate task graph, PROVES the
# freshly-generated file passes an enforced build, and uploads it. Run it after
# any dependency change; commit the produced artifact.
name: refresh-verification-metadata
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3

      # 1) Regenerate over the SAME task graph the gate enforces, so every
      #    configuration CI resolves is recorded (checksums only; no PGP keyring).
      - name: Regenerate verification metadata (sha256, gate task graph)
        run: |
          ./gradlew --write-verification-metadata sha256 \
            clean check publishToMavenLocal -x :integration-tests:test

      # 2) Prove the freshly-generated file actually ENFORCES green on the runner
      #    — a clean verifying build with no --write flag.
      - name: Prove enforced build passes with the regenerated metadata
        run: ./gradlew clean check publishToMavenLocal -x :integration-tests:test

      # 3) Publish the runner-accurate file so it can be committed as the source
      #    of truth (and diffed against the committed one to spot drift).
      - name: Upload runner-generated verification-metadata.xml
        uses: actions/upload-artifact@v4
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
