# RowRelay security gates (HEL-124): CVE scan over the LOCKED dependency graph,
# SBOM generation, and the exception-expiry policy. Runs on every push/PR that
# can change exposure, on a weekly schedule (new CVEs without code changes),
# and as a required dependency of the publish workflow.
name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly Monday 03:17 UTC
  workflow_call:            # the publish workflow gates on this

permissions:
  contents: read
  security-events: write

jobs:
  cve-scan:
    runs-on: ubuntu-latest
    env:
      # ghcr.io rate-limits anonymous DB pulls from shared runners; prefer the
      # ECR mirror with ghcr fallback. DB/download failure fails the job — a
      # SECURE failure, never a silent pass.
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
    steps:
      - uses: actions/checkout@v4

      # Pinned binary, invoked directly (no wrapper action): identical to the
      # locally-verified commands, and failures are debuggable from the run.
      - name: Install Trivy v0.54.1
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin" v0.54.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Blocking scan (HIGH/CRITICAL fail the gate)
        run: |
          trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile .trivyignore.yaml \
            --format sarif --output trivy-blocking.sarif .

      - name: Full-severity report (non-blocking, always)
        if: always()
        run: |
          trivy fs --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 --ignorefile .trivyignore.yaml \
            --format json --output trivy-full.json . || true
          trivy fs --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 --ignorefile .trivyignore.yaml \
            --format table --output trivy-full.txt . || true

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('trivy-blocking.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-blocking.sarif

      - name: Retain reports (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cve-reports
          if-no-files-found: ignore
          path: |
            trivy-blocking.sarif
            trivy-full.json
            trivy-full.txt

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Generate CycloneDX SBOM from the resolved graph
        run: ./gradlew cyclonedxBom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/sbom/
